<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Untitled Board</title>
  <link rel="stylesheet" href="chrome://browser/content/zen-styles/zen-theme.css">
  <link rel="stylesheet" href="board.css">
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="toolbar">
    <button id="pen-tool" class="tool-button active"><img src="chrome://browser/content/zen-board/icons/pen.svg" alt="Pen"></button>
    <button id="eraser-tool" class="tool-button"><img src="chrome://browser/content/zen-board/icons/eraser.svg" alt="Eraser"></button>
    <button id="text-tool" class="tool-button"><img src="chrome://browser/content/zen-board/icons/text.svg" alt="Text"></button>
  </div>
  <script src="board.js" type="module"></script>
</body>
</html>
