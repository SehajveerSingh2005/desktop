<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="chrome://browser/skin/zen-icons/canvas.svg" />
    <link
      rel="stylesheet"
      href="chrome://browser/content/zen-styles/zen-theme.css"
    />
    <link rel="stylesheet" href="board.css" />
    <link rel="localization" href="browser/zen-general.ftl" />
  </head>

  <body>
    <canvas id="canvas"></canvas>

    <!-- Board title bar -->
    <div id="board-title-bar">
      <input
        id="board-title"
        type="text"
        placeholder="Untitled Board"
        data-l10n-id="zen-board-title-placeholder"
        spellcheck="false"
        autocomplete="off"
        maxlength="80"
      />
    </div>

    <div id="toolbar">
      <div class="tool-group">
        <button
          id="select-tool"
          class="tool-button"
          title="Select/Pan"
          data-l10n-id="zen-board-select-tool"
        >
          <span
            class="tool-icon"
            style="
              mask-image: url(&quot;chrome://browser/content/zen-board/icons/mouse-pointer.svg&quot;);
            "
          ></span>
        </button>
        <button
          id="pen-tool"
          class="tool-button"
          title="Pen"
          data-l10n-id="zen-board-pen-tool"
        >
          <span
            class="tool-icon"
            style="
              mask-image: url(&quot;chrome://browser/content/zen-board/icons/pen.svg&quot;);
            "
          ></span>
        </button>
        <button
          id="shapes-tool"
          class="tool-button"
          title="Shapes"
          data-l10n-id="zen-board-shapes-tool"
        >
          <span
            class="tool-icon"
            style="
              mask-image: url(&quot;chrome://browser/skin/zen-icons/selectable/shapes.svg&quot;);
            "
          ></span>
        </button>
        <button
          id="text-tool"
          class="tool-button"
          title="Text"
          data-l10n-id="zen-board-text-tool"
        >
          <span
            class="tool-icon"
            style="
              mask-image: url(&quot;chrome://browser/content/zen-board/icons/text.svg&quot;);
            "
          ></span>
        </button>
        <button
          id="eraser-tool"
          class="tool-button"
          title="Eraser"
          data-l10n-id="zen-board-eraser-tool"
        >
          <span
            class="tool-icon"
            style="
              mask-image: url(&quot;chrome://browser/content/zen-board/icons/eraser.svg&quot;);
            "
          ></span>
        </button>
        <div class="tool-separator"></div>
        <button
          id="color-tool"
          class="tool-button"
          title="Colors"
          data-l10n-id="zen-board-colors-tool"
          style="position: relative"
        >
          <span
            class="tool-icon"
            style="
              mask-image: url(&quot;chrome://browser/content/zen-board/icons/palette.svg&quot;);
            "
          ></span>
          <div id="active-color-display"></div>
        </button>
      </div>
      <div class="tool-separator"></div>
      <div id="zoom-controls-wrapper" class="tool-group">
        <button
          id="zoom-out-btn"
          class="tool-button"
          title="Zoom Out"
          data-l10n-id="zen-board-zoom-out"
        >
          <span
            class="tool-icon"
            style="
              mask-image: url(&quot;chrome://browser/content/zen-board/icons/zoom-out.svg&quot;);
            "
          ></span>
        </button>
        <button
          id="zoom-display"
          class="tool-button"
          title="Zoom Level (Click to Reset)"
          data-l10n-id="zen-board-zoom-level"
        >
          100%
        </button>
        <button
          id="zoom-in-btn"
          class="tool-button"
          title="Zoom In"
          data-l10n-id="zen-board-zoom-in"
        >
          <span
            class="tool-icon"
            style="
              mask-image: url(&quot;chrome://browser/content/zen-board/icons/zoom-in.svg&quot;);
            "
          ></span>
        </button>
      </div>
    </div>

    <div id="pen-options" class="options-panel">
      <label for="brush-size" data-l10n-id="zen-board-brush-size">Size</label>
      <input type="range" id="brush-size" min="1" max="50" value="5" />
    </div>

    <div id="shape-options-panel" class="options-panel">
      <button
        id="shape-rectangle"
        class="shape-button active"
        title="Rectangle"
        data-l10n-id="zen-board-shape-rectangle"
      >
        <span
          class="tool-icon"
          style="
            mask-image: url(&quot;chrome://browser/skin/zen-icons/selectable/square.svg&quot;);
          "
        ></span>
      </button>
      <button
        id="shape-ellipse"
        class="shape-button"
        title="Ellipse"
        data-l10n-id="zen-board-shape-ellipse"
      >
        <span
          class="tool-icon"
          style="
            mask-image: url(&quot;chrome://browser/skin/zen-icons/selectable/circle.svg&quot;);
          "
        ></span>
      </button>
      <div class="tool-separator"></div>
      <button
        id="fill-toggle"
        class="tool-button"
        title="Toggle Fill"
        data-l10n-id="zen-board-fill-toggle"
      >
        <span
          class="tool-icon"
          style="
            mask-image: url(&quot;chrome://browser/content/zen-board/icons/fill-none.svg&quot;);
          "
        ></span>
      </button>
    </div>

    <div id="color-options-panel" class="options-panel">
      <div id="main-colors" class="color-options"></div>
    </div>

    <textarea
      id="text-editor"
      class="canvas-text-input"
      style="visibility: hidden"
    ></textarea>
    <div id="slash-menu" class="slash-menu" style="display: none">
      <div class="slash-item" data-value="# ">
        <span class="slash-icon">H1</span>Header 1
      </div>
      <div class="slash-item" data-value="## ">
        <span class="slash-icon">H2</span>Header 2
      </div>
      <div class="slash-item" data-value="- ">
        <span class="slash-icon">•</span>Bullet List
      </div>
      <div class="slash-item" data-value="1. ">
        <span class="slash-icon">1.</span>Numbered List
      </div>
    </div>
    <div
      id="video-controls"
      class="video-controls-overlay"
      style="display: none"
    ></div>
    <div
      id="capture-controls"
      class="capture-controls-overlay"
      style="display: none"
    ></div>

    <div id="font-options-panel" class="options-panel vertical">
      <button
        id="font-size-increase"
        title="Increase font size"
        data-l10n-id="zen-board-font-increase"
      >
        <span
          class="tool-icon"
          style="
            mask-image: url(&quot;chrome://global/skin/icons/plus.svg&quot;);
          "
        ></span>
      </button>
      <button
        id="font-cycle"
        title="Cycle font"
        data-l10n-id="zen-board-font-cycle"
      >
        Aa
      </button>
      <button
        id="font-size-decrease"
        title="Decrease font size"
        data-l10n-id="zen-board-font-decrease"
      >
        <span
          class="tool-icon"
          style="
            mask-image: url(&quot;chrome://browser/content/zen-board/icons/minus.svg&quot;);
          "
        ></span>
      </button>
    </div>

    <script src="board.mjs" type="module"></script>
  </body>
</html>
