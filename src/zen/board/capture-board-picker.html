<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title data-l10n-id="zen-board-picker-title"></title>
    <link rel="stylesheet" href="capture-board-picker.css" />
    <link rel="localization" href="browser/zen-general.ftl" />
  </head>
  <body>
    <div id="picker-root">
      <h2 class="picker-title">
        <span class="tool-icon" style="mask-image: url('chrome://browser/content/zen-board/icons/board-grid.svg');"></span>
        <span data-l10n-id="zen-board-picker-title"></span>
      </h2>

      <div id="new-board-section">
        <p class="section-label" data-l10n-id="zen-board-picker-create-label"></p>
        <div class="input-row">
          <input
            id="new-board-name"
            type="text"
            data-l10n-id="zen-board-picker-name-placeholder"
            placeholder="Board name…"
            maxlength="80"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="create-board-btn" class="btn btn-primary" data-l10n-id="zen-board-picker-create-btn"></button>
        </div>
      </div>

      <div id="existing-section">
        <p class="section-label" data-l10n-id="zen-board-picker-existing-label"></p>
        <div id="boards-list">
          <p id="boards-empty" class="empty-msg" hidden data-l10n-id="zen-board-picker-empty"></p>
        </div>
      </div>
    </div>
    <script src="capture-board-picker.mjs" type="module"></script>
  </body>
</html>
