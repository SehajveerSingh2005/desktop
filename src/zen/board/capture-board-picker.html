<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Add to Board</title>
    <link rel="stylesheet" href="capture-board-picker.css" />
  </head>
  <body>
    <div id="picker-root">
      <h2 class="picker-title">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <rect
            x="3"
            y="3"
            width="8"
            height="8"
            rx="1.5"
            stroke="currentColor"
            stroke-width="1.8"
          />
          <rect
            x="13"
            y="3"
            width="8"
            height="8"
            rx="1.5"
            stroke="currentColor"
            stroke-width="1.8"
          />
          <rect
            x="3"
            y="13"
            width="8"
            height="8"
            rx="1.5"
            stroke="currentColor"
            stroke-width="1.8"
          />
          <rect
            x="13"
            y="13"
            width="8"
            height="8"
            rx="1.5"
            stroke="currentColor"
            stroke-width="1.8"
          />
        </svg>
        Add to Board
      </h2>

      <div id="new-board-section">
        <p class="section-label">Create new board</p>
        <div class="input-row">
          <input
            id="new-board-name"
            type="text"
            placeholder="Board name…"
            maxlength="80"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="create-board-btn" class="btn btn-primary">Create</button>
        </div>
      </div>

      <div id="existing-section">
        <p class="section-label">Add to existing board</p>
        <div id="boards-list">
          <p id="boards-empty" class="empty-msg" hidden>No boards yet.</p>
        </div>
      </div>
    </div>
    <script src="capture-board-picker.mjs"></script>
  </body>
</html>
