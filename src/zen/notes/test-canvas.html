<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Bundle Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .test-info {
            background: #333;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .test-info h3 {
            margin-top: 0;
            color: #4CAF50;
        }
        .test-result {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        .test-result.success {
            background: #4CAF50;
            color: white;
        }
        .test-result.error {
            background: #f44336;
            color: white;
        }
        .test-result.info {
            background: #2196F3;
            color: white;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🧪 Canvas Bundle Test</h1>
        
        <div class="test-info">
            <h3>Testing Canvas Bundle</h3>
            <p>This page tests if the Excalidraw canvas bundle is working correctly.</p>
        </div>

        <div id="test-results"></div>

        <div class="test-info">
            <h3>Test Results</h3>
            <div id="test-output"></div>
        </div>
    </div>

    <!-- Load Canvas bundle -->
    <script type="text/javascript" src="../vendor/canvas.bundle.js"></script>
    
    <script>
        const testResults = document.getElementById('test-results');
        const testOutput = document.getElementById('test-output');
        
        function addTestResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            testResults.appendChild(div);
        }
        
        function log(message) {
            const div = document.createElement('div');
            div.textContent = message;
            testOutput.appendChild(div);
            console.log(message);
        }
        
        // Test 1: Check if bundle loaded
        addTestResult('Testing bundle loading...', 'info');
        
        setTimeout(() => {
            if (window.ZenCanvas) {
                addTestResult('✅ Canvas bundle loaded successfully!', 'success');
                log('ZenCanvas object found: ' + JSON.stringify(Object.keys(window.ZenCanvas)));
                
                // Test 2: Check Excalidraw component
                if (window.ZenCanvas.Excalidraw) {
                    addTestResult('✅ Excalidraw component found!', 'success');
                    log('Excalidraw component: ' + typeof window.ZenCanvas.Excalidraw);
                } else {
                    addTestResult('❌ Excalidraw component not found', 'error');
                }
                
                // Test 3: Check createCanvas function
                if (typeof window.ZenCanvas.createCanvas === 'function') {
                    addTestResult('✅ createCanvas function found!', 'success');
                } else {
                    addTestResult('❌ createCanvas function not found', 'error');
                }
                
            } else {
                addTestResult('❌ Canvas bundle failed to load', 'error');
                log('ZenCanvas object not found in window');
            }
        }, 1000);
        
        // Test 4: Check for errors
        window.addEventListener('error', (event) => {
            addTestResult('❌ JavaScript error: ' + event.message, 'error');
            log('Error: ' + event.message + ' at ' + event.filename + ':' + event.lineno);
        });
        
        // Test 5: Check console for warnings
        const originalWarn = console.warn;
        console.warn = function(...args) {
            addTestResult('⚠️ Console warning: ' + args.join(' '), 'info');
            log('Warning: ' + args.join(' '));
            originalWarn.apply(console, args);
        };
    </script>
</body>
</html>
