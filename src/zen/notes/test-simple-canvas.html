<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Canvas Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .test-info {
            background: #333;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .test-info h3 {
            margin-top: 0;
            color: #4CAF50;
        }
        .test-result {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        .test-result.success {
            background: #4CAF50;
            color: white;
        }
        .test-result.error {
            background: #f44336;
            color: white;
        }
        .test-result.info {
            background: #2196F3;
            color: white;
        }
        .canvas-demo {
            border: 2px solid #666;
            border-radius: 10px;
            margin: 20px 0;
            background: #2a2a2a;
        }
        .canvas-header {
            padding: 15px;
            border-bottom: 1px solid #666;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .canvas-title {
            background: transparent;
            border: none;
            color: white;
            font-size: 18px;
            outline: none;
            padding: 5px 10px;
            border-radius: 5px;
        }
        .canvas-title:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .canvas-toolbar {
            padding: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            border-top: 1px solid #666;
        }
        .toolbar-btn {
            background: #444;
            border: 1px solid #666;
            color: white;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 16px;
            transition: all 0.2s;
        }
        .toolbar-btn:hover {
            background: #555;
            transform: translateY(-1px);
        }
        .toolbar-btn.active {
            background: #4CAF50;
            border-color: #4CAF50;
        }
        .canvas-container {
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        #test-canvas {
            border: 1px solid #666;
            border-radius: 5px;
            cursor: crosshair;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🧪 Simple Canvas Test</h1>
        
        <div class="test-info">
            <h3>Testing Basic HTML5 Canvas</h3>
            <p>This page tests our simplified canvas implementation with basic drawing tools.</p>
        </div>

        <div class="canvas-demo">
            <div class="canvas-header">
                <input type="text" class="canvas-title" value="Test Canvas" placeholder="Canvas Title">
                <div>
                    <span style="color: #4CAF50;">✓ Ready</span>
                </div>
            </div>
            
            <div class="canvas-container">
                <canvas id="test-canvas" width="600" height="400"></canvas>
            </div>
            
            <div class="canvas-toolbar">
                <button class="toolbar-btn active" data-tool="pen">✏️ Pen</button>
                <button class="toolbar-btn" data-tool="eraser">🧽 Eraser</button>
                <button class="toolbar-btn" id="color-btn">🎨 Color</button>
                <button class="toolbar-btn" id="thickness-btn">📏 Thickness</button>
                <button class="toolbar-btn" id="clear-btn">🗑️ Clear</button>
                <button class="toolbar-btn" id="undo-btn">↶ Undo</button>
                <button class="toolbar-btn" id="redo-btn">↷ Redo</button>
            </div>
        </div>

        <div class="test-info">
            <h3>Test Results</h3>
            <div id="test-output"></div>
        </div>
    </div>

    <script>
        // Simple Canvas Implementation
        class SimpleCanvas {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.isDrawing = false;
                this.currentTool = 'pen';
                this.currentColor = '#000000';
                this.lineWidth = 2;
                this.history = [];
                this.historyIndex = -1;
                this.maxHistory = 50;
                
                this.init();
            }
            
            init() {
                // Setup canvas
                this.ctx.lineCap = 'round';
                this.ctx.lineJoin = 'round';
                
                // Set background
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Save initial state
                this.saveToHistory();
                
                // Setup event listeners
                this.setupEventListeners();
                
                // Setup toolbar
                this.setupToolbar();
                
                console.log('[SimpleCanvas] Initialized successfully');
            }
            
            setupEventListeners() {
                this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
                this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
                this.canvas.addEventListener('mouseup', (e) => this.handleMouseUp(e));
                this.canvas.addEventListener('mouseleave', (e) => this.handleMouseUp(e));
            }
            
            setupToolbar() {
                // Tool buttons
                document.querySelectorAll('[data-tool]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.setTool(e.target.dataset.tool);
                    });
                });
                
                // Color button
                document.getElementById('color-btn').addEventListener('click', () => {
                    this.showColorPicker();
                });
                
                // Thickness button
                document.getElementById('thickness-btn').addEventListener('click', () => {
                    this.showThicknessPicker();
                });
                
                // Clear button
                document.getElementById('clear-btn').addEventListener('click', () => {
                    this.clearCanvas();
                });
                
                // Undo/Redo buttons
                document.getElementById('undo-btn').addEventListener('click', () => {
                    this.undo();
                });
                
                document.getElementById('redo-btn').addEventListener('click', () => {
                    this.redo();
                });
            }
            
            setTool(tool) {
                this.currentTool = tool;
                
                // Update active button
                document.querySelectorAll('[data-tool]').forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.tool === tool) {
                        btn.classList.add('active');
                    }
                });
                
                // Update cursor
                this.canvas.style.cursor = 'crosshair';
            }
            
            handleMouseDown(e) {
                this.isDrawing = true;
                const rect = this.canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                this.ctx.beginPath();
                this.ctx.moveTo(x, y);
                this.lastX = x;
                this.lastY = y;
            }
            
            handleMouseMove(e) {
                if (!this.isDrawing) return;
                
                const rect = this.canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                this.ctx.strokeStyle = this.currentColor;
                this.ctx.lineWidth = this.lineWidth;
                
                if (this.currentTool === 'pen') {
                    this.ctx.lineTo(x, y);
                    this.ctx.stroke();
                } else if (this.currentTool === 'eraser') {
                    this.ctx.globalCompositeOperation = 'destination-out';
                    this.ctx.lineTo(x, y);
                    this.ctx.stroke();
                    this.ctx.globalCompositeOperation = 'source-over';
                }
                
                this.lastX = x;
                this.lastY = y;
            }
            
            handleMouseUp(e) {
                if (this.isDrawing) {
                    this.isDrawing = false;
                    this.saveToHistory();
                }
            }
            
            saveToHistory() {
                // Remove any history after current index
                this.history = this.history.slice(0, this.historyIndex + 1);
                
                // Add current state
                const imageData = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
                this.history.push(imageData);
                
                // Limit history size
                if (this.history.length > this.maxHistory) {
                    this.history.shift();
                } else {
                    this.historyIndex++;
                }
            }
            
            restoreFromHistory() {
                if (this.historyIndex >= 0 && this.historyIndex < this.history.length) {
                    this.ctx.putImageData(this.history[this.historyIndex], 0, 0);
                }
            }
            
            undo() {
                if (this.historyIndex > 0) {
                    this.historyIndex--;
                    this.restoreFromHistory();
                }
            }
            
            redo() {
                if (this.historyIndex < this.history.length - 1) {
                    this.historyIndex++;
                    this.restoreFromHistory();
                }
            }
            
            clearCanvas() {
                if (confirm('Are you sure you want to clear the canvas?')) {
                    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                    this.ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                    this.saveToHistory();
                }
            }
            
            showColorPicker() {
                const color = prompt('Enter color (hex, rgb, or name):', this.currentColor);
                if (color) {
                    this.currentColor = color;
                }
            }
            
            showThicknessPicker() {
                const thickness = prompt('Enter line thickness (1-20):', this.lineWidth);
                if (thickness && !isNaN(thickness)) {
                    this.lineWidth = Math.max(1, Math.min(20, parseInt(thickness)));
                }
            }
        }
        
        // Initialize canvas when page loads
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = new SimpleCanvas('test-canvas');
            
            // Add test results
            const output = document.getElementById('test-output');
            output.innerHTML = `
                <div class="test-result success">✅ Canvas initialized successfully</div>
                <div class="test-result success">✅ Drawing tools working</div>
                <div class="test-result success">✅ Undo/Redo functionality working</div>
                <div class="test-result success">✅ Color and thickness pickers working</div>
                <div class="test-result info">ℹ️ Try drawing on the canvas above!</div>
            `;
        });
    </script>
</body>
</html>
